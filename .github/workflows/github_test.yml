name: Test
on: [push]
jobs:
  Test-Changes:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v3
      - run: echo "💡 The ${{ github.repository }} repository has been cloned to the runner."
      - name: Install uv
        shell: bash -l {0}
        run: pip install uv
      - name: Run ruff format
        shell: bash -l {0}
        run: uv run ruff format . --diff
      - name: Run isort
        shell: bash -l {0}
        run: uv run ruff check --extend-select I . --diff
      - name: Run mypy
        shell: bash -l {0}
        run: uv run -m mypy --strict . || true
      - name: Pytest
        shell: bash -l {0} || true
        run: uv run -m pytest
